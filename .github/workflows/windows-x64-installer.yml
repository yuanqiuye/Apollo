name: Windows x64 Installer

on:
  workflow_dispatch:
    inputs:
      winuhid_repository:
        description: "Repository containing the WinUHid source to build"
        required: false
        default: "yuanqiuye/WinUHid"
      winuhid_ref:
        description: "Branch, tag, or SHA to checkout from winuhid_repository"
        required: false
        default: "main"
      release_tag:
        description: "Release tag to create when publish_release is enabled"
        required: false
        default: ""
      publish_release:
        description: "Upload the installer to a GitHub Release"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"
      - "apollo-winuhid-*"
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-windows-x64-installer:
    name: Build Windows x64 installer
    runs-on: windows-2022

    env:
      BUILD_TYPE: Release
      APOLLO_BUILD_DIR: ${{ github.workspace }}\build\apollo-windows-x64
      WINUHID_CHECKOUT_DIR: ${{ github.workspace }}\_deps\WinUHid
      WINUHID_PACKAGE_DIR: ${{ github.workspace }}\build\winuhid-runtime
      DIST_DIR: ${{ github.workspace }}\dist

    steps:
      - name: Checkout Apollo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
            } else {
              $tag = "apollo-winuhid-${{ github.run_number }}"
            }
          }

          $safeName = $tag -replace '[^A-Za-z0-9_.-]', '-'
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "ARTIFACT_VERSION=$safeName" >> $env:GITHUB_ENV

      - name: Checkout WinUHid
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.winuhid_repository || 'yuanqiuye/WinUHid' }}
          ref: ${{ inputs.winuhid_ref || 'main' }}
          path: _deps/WinUHid

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-minhook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build WinUHid runtime DLLs
        shell: pwsh
        run: |
          msbuild "$env:WINUHID_CHECKOUT_DIR\WinUHid\WinUHid.vcxproj" `
            /p:Configuration=$env:BUILD_TYPE `
            /p:Platform=x64 `
            /m `
            /verbosity:minimal

          msbuild "$env:WINUHID_CHECKOUT_DIR\WinUHidDevs\WinUHidDevs.vcxproj" `
            /p:Configuration=$env:BUILD_TYPE `
            /p:Platform=x64 `
            /m `
            /verbosity:minimal

      - name: Prepare WinUHid runtime package
        shell: pwsh
        run: |
          .\scripts\prepare_winuhid_runtime.ps1 `
            -WinUHidRoot "$env:WINUHID_CHECKOUT_DIR" `
            -OutputDir "$env:WINUHID_PACKAGE_DIR" `
            -DriverPackageDir ".\src_assets\windows\misc\gamepad\winuhid" `
            -Configuration $env:BUILD_TYPE `
            -Platform x64

      - name: Configure Apollo
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "C:\msys64\ucrt64\lib\pkgconfig"

          & C:\msys64\ucrt64\bin\cmake.exe `
            -S . `
            -B "$env:APOLLO_BUILD_DIR" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DBUILD_TESTS=OFF `
            -DWINUHID_PACKAGE_DIR="$env:WINUHID_PACKAGE_DIR"

      - name: Build Apollo
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:PATH"

          & C:\msys64\ucrt64\bin\cmake.exe --build "$env:APOLLO_BUILD_DIR" --target web-ui --parallel 4
          & C:\msys64\ucrt64\bin\cmake.exe --build "$env:APOLLO_BUILD_DIR" --target sunshine --parallel 4
          & C:\msys64\ucrt64\bin\cmake.exe --build "$env:APOLLO_BUILD_DIR" --target sunshinesvc --parallel 4

      - name: Package Apollo installer
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path "$env:DIST_DIR" | Out-Null

          & C:\msys64\ucrt64\bin\cpack.exe `
            -G NSIS `
            --config "$env:APOLLO_BUILD_DIR\CPackConfig.cmake" `
            --verbose

          $installer = Get-ChildItem "$env:APOLLO_BUILD_DIR\cpack_artifacts" -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "No NSIS installer was produced under $env:APOLLO_BUILD_DIR\cpack_artifacts"
          }

          $installerName = "Apollo-WinUHid-$env:ARTIFACT_VERSION-windows-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path "$env:DIST_DIR" $installerName) -Force

          Compress-Archive `
            -Path "$env:WINUHID_PACKAGE_DIR\*" `
            -DestinationPath (Join-Path "$env:DIST_DIR" "WinUHid-runtime-$env:ARTIFACT_VERSION-windows-x64.zip") `
            -Force

          Get-ChildItem "$env:DIST_DIR"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-WinUHid-${{ env.ARTIFACT_VERSION }}-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Apollo WinUHid ${{ env.RELEASE_TAG }}
          files: dist/*
